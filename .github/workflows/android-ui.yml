name: Interfaz móvil Grafiplot
on:
  push:
    branches: [main, codex/android-productos]
    paths: ['android/app/src/main/assets/**', 'android/tests/**', '.github/workflows/android-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Comprobar búsqueda, escaneo recibido, detalles y registro
        run: node android/tests/mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vista-movil
          path: android/tests/mobile-home.png
